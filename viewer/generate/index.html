<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CFB Sim Builder</title>
    </head>
    <body>
        <header class="bar">
            <strong class="brand">CFB Sim Builder</strong>
            <nav class="tabs">
                <button id="btn-matchup">Matchup</button>
                <button id="btn-results">Results</button>
                <button id="btn-teams">Teams</button>
            </nav>
            <span class="spacer"></span>
            <div class="conn">
                <button id="conn-button" class="conn-button connecting" title="The server: click to change its address">
                    <span class="dot"></span><span id="conn-label">Connecting…</span>
                </button>
                <div id="conn-pop" class="conn-pop" hidden>
                    <div id="conn-status" class="muted"></div>
                    <div class="conn-row">
                        <input id="conn-url" type="text" size="24" aria-label="Server address" />
                        <button id="conn-go" class="primary">Connect</button>
                    </div>
                </div>
            </div>
            <a class="button" href="/" title="Back to the game viewer">Viewer</a>
        </header>
        <div id="job" class="job" hidden>
            <progress id="job-progress" value="0" max="1"></progress>
            <span id="job-text"></span>
            <span id="job-file" class="job-file" hidden></span>
            <button id="job-cancel" hidden>Cancel</button>
        </div>
        <main>
            <div id="tab-teams" class="tab" hidden></div>
            <div id="tab-matchup" class="tab" hidden></div>
            <div id="tab-results" class="tab" hidden></div>
        </main>
        <script type="module" src="/src/builder/main.ts"></script>
    </body>
</html>

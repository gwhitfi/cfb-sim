<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CFB Sim Viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <strong class="brand">CFB Sim</strong>
      <label class="button">
        Open file…
        <input id="file-input" type="file" accept=".jsonl,.json" hidden />
      </label>
      <select id="repo-files" title="Tracking files in the repo (dev server only)" hidden></select>
      <button id="reload" title="Reload this file from disk (R)" disabled>Reload</button>
      <button id="game-toggle" title="Play or watch a full game (needs cfbsim-server)">Game…</button>
      <span id="title" class="title">Drop a tracking file anywhere</span>
    </header>

    <main class="main">
      <div id="stage" class="stage">
        <canvas id="canvas"></canvas>
        <div id="empty" class="empty">
          <p><strong>Drop a tracking file here</strong> (<code>*.jsonl</code>)</p>
          <p>Make one with <code>./build/debug/cli/cfbsim run-drill forty --out forty.jsonl</code></p>
        </div>
        <div id="error" class="error" hidden></div>
        <div id="tooltip" class="tooltip" hidden></div>
        <div id="scoreboard" class="scoreboard" hidden></div>
        <div id="prompt" class="prompt" hidden></div>
      </div>

      <aside class="side">
        <section id="game" class="game" hidden>
          <h2>Game</h2>
          <div class="row"><input id="game-server" size="22" /> <button id="game-connect">Connect</button></div>
          <div id="game-status" class="muted"></div>
          <div id="game-setup">
            <label>Home <select id="game-home"></select></label>
            <label>Away <select id="game-away"></select></label>
            <label>You coach
              <select id="game-side">
                <option value="home">Home</option>
                <option value="away">Away</option>
                <option value="both">Both</option>
                <option value="none">Neither (watch)</option>
              </select>
            </label>
            <label>Seed <input id="game-seed" size="8" placeholder="random" /></label>
            <button id="game-start">Kick off</button>
            <h2>Watch a game log</h2>
            <select id="game-logs"></select>
            <button id="game-watch">Watch</button>
          </div>
          <div id="game-live" hidden>
            <div id="game-mine" class="row">
              <label><input type="checkbox" id="game-auto" /> Coach calls my plays</label>
              <button id="game-timeout" title="At the line: right away. Otherwise at the next dead ball.">Timeout</button>
            </div>
            <div class="row">
              <label><input type="checkbox" id="game-skip" /> Skip animations</label>
              <button id="game-stop">End</button>
            </div>
            <ol id="feed" class="feed"></ol>
          </div>
        </section>
        <section>
          <h2>Recording</h2>
          <dl id="info" class="info"></dl>
        </section>
        <section>
          <h2>Overlays</h2>
          <label><input type="checkbox" id="opt-velocity" /> Velocity <kbd>V</kbd></label>
          <label><input type="checkbox" id="opt-trails" /> Trails <kbd>T</kbd></label>
          <label><input type="checkbox" id="opt-names" /> Names <kbd>N</kbd></label>
          <label>Labels
            <select id="opt-labels">
              <option value="label">Slot / label</option>
              <option value="jersey">Jersey</option>
              <option value="position">Position</option>
              <option value="none">None</option>
            </select>
          </label>
          <div id="layers"></div>
        </section>
        <section>
          <h2>Player</h2>
          <div id="player" class="muted">Click a player</div>
        </section>
        <section class="grow">
          <h2>Events</h2>
          <ol id="events" class="events"></ol>
        </section>
      </aside>
    </main>

    <footer class="transport">
      <button id="back" title="Back one tick (←, Shift+← for 1 s)"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 2h2v12H3zM14 2v12L6 8z" fill="currentColor"/></svg></button>
      <button id="play" title="Play / pause (Space)"></button>
      <button id="fwd" title="Forward one tick (→, Shift+→ for 1 s)"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M11 2h2v12h-2zM2 2v12l8-6z" fill="currentColor"/></svg></button>
      <input id="scrub" type="range" min="0" max="0" step="1" value="0" />
      <span id="clock" class="clock">0.00 s · tick 0</span>
      <select id="speed" title="Playback speed ([ and ])"></select>
      <select id="view" title="Camera: sideline or vertical (C)">
        <option value="horizontal">Sideline</option>
        <option value="vertical">Vertical</option>
      </select>
      <select id="view-behind" title="Vertical view: the team attacking up the screen" hidden>
        <option value="offense">Behind offense</option>
        <option value="home">Behind home</option>
        <option value="away">Behind away</option>
      </select>
      <select id="zoom" title="Zoom: fixed (the same zoom every play, following the ball; scroll to change it) or fit each play">
        <option value="fixed">Fixed zoom</option>
        <option value="fit">Fit play</option>
      </select>
      <button id="fit" title="Fixed zoom: back to the default zoom (F), recenter on the ball (Shift+F). Fit play: fit the field (F), fit the players (Shift+F)">Fit</button>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
